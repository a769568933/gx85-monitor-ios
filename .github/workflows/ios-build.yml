name: Build GX85 iPhone App

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - GX85Core/**
      - GX85Monitor/**
      - GX85MonitorTests/**
      - GX85Monitor.xcodeproj/**
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: gx85-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report Apple toolchain
        run: xcodebuild -version
      - name: Test protocol and frame core
        run: swift test --package-path GX85Core
      - name: Select available iPhone simulator
        run: python3 scripts/select-simulator.py
      - name: Test iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild test \
            -project GX85Monitor.xcodeproj \
            -scheme GX85Monitor \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/Simulator \
            -resultBundlePath dist/iPhoneTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee dist/simulator-tests.log
      - name: Capture actual iPhone app screen
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$SIMULATOR_UDID" build/Simulator/Build/Products/Debug-iphonesimulator/GX85Monitor.app
          xcrun simctl terminate "$SIMULATOR_UDID" com.gx85monitor.app || true
          xcrun simctl launch "$SIMULATOR_UDID" com.gx85monitor.app
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot dist/GX85Monitor-iPhone-portrait.png
          sips -g pixelWidth -g pixelHeight dist/GX85Monitor-iPhone-portrait.png
      - name: Save iPhone screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GX85Monitor-iPhone-screenshot
          path: dist/GX85Monitor-iPhone-portrait.png
          if-no-files-found: error
          retention-days: 14
      - name: Build unsigned device IPA
        run: bash scripts/build-ipa.sh
      - name: Save install package
        uses: actions/upload-artifact@v4
        with:
          name: GX85Monitor-unsigned-IPA
          path: dist/GX85Monitor-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GX85Monitor-validation
          path: |
            dist/*.log
            dist/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
